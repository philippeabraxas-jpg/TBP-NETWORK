<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="Hiérarchie de clés et de temps : les contrôleurs (m-of-n, HSM) signent un jeton d'époque à TTL d'environ 60 secondes, qui autorise des clés de cellule, qui signent à leur tour des tokens d'action à très courte durée de vie.">
  <title>Hiérarchie de clés et de temps</title>
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="260" y="25" width="260" height="70" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="390" y="53" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5490">Contrôleurs</text>
    <text x="390" y="70" text-anchor="middle" font-size="10" fill="#1a5490">m-of-n, HSM</text>
    <text x="620" y="65" font-size="9.5" fill="#888">longue durée</text>

    <rect x="260" y="150" width="260" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="390" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Jeton d'époque</text>
    <text x="390" y="193" text-anchor="middle" font-size="9.5" fill="#555">(N, autorité, TTL ~60 s)</text>
    <text x="620" y="190" font-size="9.5" fill="#888">TTL ~60 s</text>

    <rect x="260" y="275" width="260" height="65" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="390" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Clés de cellule</text>
    <text x="390" y="320" text-anchor="middle" font-size="9.5" fill="#555">une par cellule active</text>
    <text x="620" y="313" font-size="9.5" fill="#888">durée de l'époque</text>

    <rect x="260" y="395" width="260" height="55" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="390" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5490">Tokens d'action</text>
    <text x="390" y="437" text-anchor="middle" font-size="9.5" fill="#1a5490">TTL 30–60 s, jti unique</text>
  </g>

  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow6)">
    <line x1="390" y1="95" x2="390" y2="146"/>
    <line x1="390" y1="220" x2="390" y2="271"/>
    <line x1="390" y1="340" x2="390" y2="391"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">
    <text x="470" y="128">signent</text>
    <text x="470" y="253">autorisent</text>
    <text x="470" y="373">signent</text>
  </g>
</svg>

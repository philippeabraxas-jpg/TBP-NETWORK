<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Le handshake inter-entités prouve trois choses en séquence : les règles sous lesquelles l'entité opère, la continuité de son historique, et sa vivacité opérationnelle à l'instant présent — avant tout traitement différencié.">
  <title>Handshake inter-entités — trois preuves</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="120" y="30" width="160" height="46" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5490">Vérifieur</text>
    <rect x="620" y="30" width="160" height="46" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="700" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Entité (cellule)</text>
  </g>
  <line x1="200" y1="76" x2="200" y2="330" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="700" y1="76" x2="700" y2="330" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Step 1 -->
  <g font-family="Helvetica,Arial,sans-serif">
    <line x1="700" y1="120" x2="206" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="450" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">① policy_id = hash(P)</text>
    <text x="450" y="135" text-anchor="middle" font-size="10" fill="#555">sous quelles règles l'entité opère — subsomption mécanique</text>
  </g>

  <!-- Step 2 -->
  <g font-family="Helvetica,Arial,sans-serif">
    <line x1="700" y1="190" x2="206" y2="190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="450" y="178" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">② preuve de consistance O(log n)</text>
    <text x="450" y="205" text-anchor="middle" font-size="10" fill="#555">historique continu — discontinuité = corruption = refus</text>
  </g>

  <!-- Step 3, challenge-response -->
  <g font-family="Helvetica,Arial,sans-serif">
    <line x1="200" y1="248" x2="694" y2="248" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="450" y="240" text-anchor="middle" font-size="10.5" fill="#333">③ nonce (challenge)</text>
    <line x1="700" y1="285" x2="206" y2="285" stroke="#1a5490" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <text x="450" y="277" text-anchor="middle" font-size="10.5" fill="#1a5490">cycle OPA réel → feuille → signature HSM</text>
    <text x="450" y="302" text-anchor="middle" font-size="10" fill="#555">vivacité opérationnelle — cible n'acceptant que des tokens émis in-flight</text>
  </g>

  <!-- Verdict -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="270" y="345" width="360" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="450" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a">Traitement différencié (§3.3)</text>
    <text x="450" y="386" text-anchor="middle" font-size="10" fill="#555">attesté → calibré · inconnu → tier strict · discontinuité → refus + alarme</text>
  </g>
  <line x1="450" y1="330" x2="450" y2="343" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 300" role="img" aria-label="La chaîne de gouvernance TBP : un agent probabiliste produit une intention, le traducteur la convertit en action structurée, OPA rend une décision déterministe, le PEP exécute si autorisé, et le registre enregistre une preuve — seule l'action traduite entre dans la chaîne déterministe.">
  <title>Chaîne de gouvernance TBP</title>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Boundary: deterministic / machine-level -->
  <rect x="205" y="95" width="735" height="150" fill="none" stroke="#1a5490" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>
  <text x="572" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1a5490">déterministe, niveau machine — preuve vérifiable par un tiers</text>

  <text x="115" y="85" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#888">probabiliste</text>

  <!-- Boxes -->
  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="30" y="135" width="150" height="70" fill="#f7f7f7" stroke="#888" stroke-width="1.5" rx="5"/>
    <text x="105" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Agent</text>
    <text x="105" y="182" text-anchor="middle" font-size="10.5" fill="#555">LLM, intention NL</text>

    <rect x="220" y="135" width="150" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="295" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Traducteur</text>
    <text x="295" y="182" text-anchor="middle" font-size="10.5" fill="#555">IA locale, §4.5</text>

    <rect x="410" y="135" width="150" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="485" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">OPA</text>
    <text x="485" y="182" text-anchor="middle" font-size="10.5" fill="#555">décision, §12</text>

    <rect x="600" y="135" width="150" height="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="675" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">PEP</text>
    <text x="675" y="182" text-anchor="middle" font-size="10.5" fill="#555">exécution, §4.1</text>

    <rect x="790" y="135" width="150" height="70" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="865" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5490">Registre</text>
    <text x="865" y="182" text-anchor="middle" font-size="10.5" fill="#1a5490">feuille (preuve), §6</text>
  </g>

  <!-- Arrows -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow1)">
    <line x1="180" y1="170" x2="216" y2="170"/>
    <line x1="370" y1="170" x2="406" y2="170"/>
    <line x1="560" y1="170" x2="596" y2="170"/>
    <line x1="750" y1="170" x2="786" y2="170"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333" text-anchor="middle">
    <text x="198" y="160">intention (NL)</text>
    <text x="388" y="160">action structurée</text>
    <text x="578" y="160">allow / deny</text>
    <text x="768" y="160">si allow</text>
  </g>

  <text x="485" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Le mensonge d'intention de l'agent ne se propage jamais : seule l'action traduite entre dans la chaîne déterministe (§1, §4.5).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Topologie réseau : le NAC aiguille un poste authentifié vers le VLAN broker et un poste inconnu vers un VLAN captif dont la seule route est l'enrôlement ; le mur serveur n'accepte que le broker, aucun chemin direct client vers serveur.">
  <title>Le mur et l'aiguillage — topologie réseau</title>
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="Helvetica,Arial,sans-serif">
    <!-- Endpoints -->
    <rect x="30" y="40" width="170" height="55" fill="#f7f7f7" stroke="#888" stroke-width="1.5" rx="5"/>
    <text x="115" y="72" text-anchor="middle" font-size="12" fill="#1a1a1a">Poste inconnu</text>

    <rect x="30" y="150" width="170" height="55" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="115" y="182" text-anchor="middle" font-size="12" fill="#1a1a1a">Poste enregistré</text>

    <!-- NAC -->
    <rect x="280" y="90" width="180" height="80" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="370" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5490">NAC</text>
    <text x="370" y="138" text-anchor="middle" font-size="10" fill="#1a5490">aiguillage — 802.1X / EAP-TLS</text>
    <text x="370" y="154" text-anchor="middle" font-size="10" fill="#1a5490">(§5.1)</text>

    <!-- Captive VLAN -->
    <rect x="280" y="250" width="180" height="70" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" rx="5"/>
    <text x="370" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">VLAN captif</text>
    <text x="370" y="292" text-anchor="middle" font-size="9.5" fill="#666">seule route : enrôlement</text>
    <text x="370" y="305" text-anchor="middle" font-size="9.5" fill="#666">ou broker-forcé</text>

    <!-- Broker VLAN -->
    <rect x="530" y="60" width="170" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="615" y="95" text-anchor="middle" font-size="12" fill="#1a1a1a">VLAN Broker</text>

    <rect x="530" y="180" width="170" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="615" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Broker</text>
    <text x="615" y="222" text-anchor="middle" font-size="9.5" fill="#555">seul point d'accès</text>

    <!-- Wall -->
    <line x1="770" y1="30" x2="770" y2="330" stroke="#1a1a1a" stroke-width="3"/>
    <text x="770" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">MUR</text>

    <!-- Server VLAN -->
    <rect x="800" y="180" width="140" height="60" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="870" y="205" text-anchor="middle" font-size="12" fill="#1a1a1a">VLAN Serveurs</text>
    <text x="870" y="222" text-anchor="middle" font-size="9" fill="#555">accepte only broker</text>

    <!-- PKI note -->
    <rect x="280" y="380" width="180" height="55" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" rx="5"/>
    <text x="370" y="403" text-anchor="middle" font-size="11" fill="#555">PKI du handshake (§3)</text>
    <text x="370" y="418" text-anchor="middle" font-size="9.5" fill="#666">EAP-TLS réutilise cette PKI</text>
  </g>

  <!-- Arrows -->
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow3)">
    <line x1="200" y1="70" x2="276" y2="115"/>
    <line x1="200" y1="177" x2="276" y2="140"/>
    <line x1="460" y1="115" x2="526" y2="95" stroke="#1a5490"/>
    <line x1="370" y1="170" x2="370" y2="246"/>
    <line x1="615" y1="120" x2="615" y2="176"/>
    <line x1="700" y1="210" x2="766" y2="210"/>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#333">
    <text x="493" y="98" fill="#1a5490">authentifié</text>
    <text x="378" y="215">inconnu</text>
    <text x="720" y="203">jamais direct</text>
  </g>
  <line x1="370" y1="378" x2="370" y2="174" stroke="#888" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow3)"/>

  <text x="480" y="455" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#555">Anti-détour L2 (§5.1) : VLAN serveurs strict, DHCP snooping + DAI, AP isolation.</text>
</svg>

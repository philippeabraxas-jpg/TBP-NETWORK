<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Passeport à capacité bornée : l'enveloppe d'egress est comptée à l'émission par le broker, le volume est décompté à l'exécution par le PEP/terminateur ; seule la télémétrie de métadonnées, jamais le contenu, alimente le registre.">
  <title>Passeport à capacité bornée — séparation des températures</title>
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <g font-family="Helvetica,Arial,sans-serif">
    <rect x="40" y="50" width="230" height="90" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="155" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5490">Broker</text>
    <text x="155" y="97" text-anchor="middle" font-size="10" fill="#1a5490">émission — enveloppe d'egress</text>
    <text x="155" y="112" text-anchor="middle" font-size="9.5" fill="#1a5490">quota par entité/époque, évalué OPA</text>

    <rect x="335" y="65" width="180" height="60" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="425" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Passeport</text>
    <text x="425" y="107" text-anchor="middle" font-size="9.5" fill="#555">quota, TTL, jti — signé</text>

    <rect x="580" y="50" width="260" height="90" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="710" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">PEP / terminateur</text>
    <text x="710" y="97" text-anchor="middle" font-size="10" fill="#1a1a1a">exécution — compteur de volume</text>
    <text x="710" y="112" text-anchor="middle" font-size="9.5" fill="#555">état léger, TTL court, 1 terminateur/session</text>

    <rect x="580" y="200" width="260" height="65" fill="#fff" stroke="#1a1a1a" stroke-width="1.5" rx="5"/>
    <text x="710" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Télémétrie de métadonnées</text>
    <text x="710" y="245" text-anchor="middle" font-size="9.5" fill="#555">octets/intervalle, destination, rythme</text>
    <text x="710" y="258" text-anchor="middle" font-size="9.5" fill="#555">(style NetFlow/IPFIX)</text>

    <rect x="580" y="320" width="260" height="60" fill="#eef4fa" stroke="#1a5490" stroke-width="1.5" rx="5"/>
    <text x="710" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a5490">Registre</text>
    <text x="710" y="365" text-anchor="middle" font-size="9.5" fill="#1a5490">une feuille par enregistrement</text>

    <rect x="280" y="200" width="240" height="65" fill="#fff" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" rx="5"/>
    <text x="400" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Dépassement de quota</text>
    <text x="400" y="242" text-anchor="middle" font-size="9.5" fill="#666">coupure propre + refus</text>
    <text x="400" y="255" text-anchor="middle" font-size="9.5" fill="#666">+ feuille au registre</text>
  </g>

  <g stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arrow5)">
    <line x1="270" y1="95" x2="331" y2="95"/>
    <line x1="515" y1="95" x2="576" y2="95"/>
    <line x1="710" y1="140" x2="710" y2="196"/>
    <line x1="710" y1="265" x2="710" y2="316"/>
    <line x1="650" y1="140" x2="450" y2="196"/>
  </g>

  <text x="450" y="405" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#555">Interdit (§4.1-bis) : inspecter le contenu des flux. L'anti-dribble repose exclusivement sur le post-traitement des métadonnées.</text>
</svg>

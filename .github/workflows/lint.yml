name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5  # v2.2.0
        with:
          # Épinglé (revue de sécurité post-#86) : "latest" laissait passer
          # une régression de comportement OPA amont sans qu'aucun contrôle
          # ne la voie — c'est ainsi que le bug de provenance
          # (provenance.bundles.<clé>.revision vs provenance.revision,
          # #86/f649788) est passé inaperçu de la CI, découvert seulement
          # par lecture manuelle contre le vrai binaire. Cette version est
          # celle vérifiée empiriquement dans ce dépôt (deploy/selftest,
          # policies/gen_capabilities.sh) — la faire évoluer est une
          # décision délibérée, jamais un effet de bord de "latest".
          version: 1.20.2
      - name: opa fmt --diff
        run: opa fmt --list --diff policies/rego/
      - name: opa check
        run: opa check policies/rego/
      # Tests des paquets de règles (policies/tests/, volontairement hors du
      # bundle et du validateur de déterminisme). Un paquet qui refuse tout
      # passerait sans eux : chaque refus y a son cas voisin autorisé.
      - name: opa test (paquets de règles)
        run: opa test policies/rego/ policies/tests/
      - name: gen_capabilities.sh (fails if a forbidden built-in vanishes from a newer OPA release)
        run: policies/gen_capabilities.sh

  # Le catalogue de conformité (tbp-compliance/) est un actif vivant : ce job
  # échoue s'il dérive (ligne partielle, 🔴 sans issue, ⚪ sans motif, état de
  # fiche ou du README qui ne découle pas des lignes).
  compliance-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: cohérence du catalogue de conformité
        run: python3 tbp-compliance/check_catalog.py
      # Issue #193 : toute action doit être épinglée par SHA de commit.
      - name: actions épinglées par SHA (#193)
        run: |
          python3 .github/scripts/check_pinned_actions.py
          python3 .github/scripts/test_check_pinned_actions.py

  nftables-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Check nftables syntax (dry parse, no load)
        run: |
          sudo apt-get update && sudo apt-get install -y nftables
          for f in config/nftables/*.nft; do
            echo "Checking $f"
            sudo nft -c -f "$f"
          done

  # Placeholder — pas de Dockerfile ni de code src/ pour l'instant (voir
  # src/*/README.md). À activer une fois qu'il y a quelque chose à builder.
  # docker:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
  #     - run: docker compose -f lab/docker-compose.yml config

  # Catalogue de conformité #157 (OWASP SCVS), famille « Analyse de
  # composants » : aucun scanner de vulnérabilités des dépendances n'était
  # câblé — govulncheck est l'outil officiel Go, il ne signale que les
  # vulnérabilités RÉELLEMENT atteignables par du code appelé (pas
  # simplement présentes dans go.sum), donc pas de bruit de faux positifs
  # sur une dépendance importée mais jamais invoquée.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.1"
      - name: "install govulncheck (épinglé — même doctrine que OPA ci-dessus : une CVE amont ne doit jamais changer silencieusement de comportement de scan)"
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck ./...
        run: govulncheck ./...

  # Catalogue de conformité #157 (OWASP SCVS), famille « SBOM » : aucune
  # nomenclature logicielle générée. cyclonedx-gomod produit un SBOM
  # CycloneDX du module Go, publié comme artefact du run — pas un gate qui
  # bloque la CI (une nomenclature n'est pas un contrôle pass/fail), juste
  # une preuve de composition publiée à chaque build.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.1"
      - name: install cyclonedx-gomod (épinglé)
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: générer le SBOM CycloneDX
        run: cyclonedx-gomod mod -json -output sbom.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: sbom.json

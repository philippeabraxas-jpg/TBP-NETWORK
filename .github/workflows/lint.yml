name: lint

on:
  pull_request:
  push:
    branches: [main]

# #193 : jeton minimal par défaut — ces jobs ne font que lire le dépôt. Sans ce bloc le jeton hérite des
# droits par défaut du dépôt (écriture possible selon les réglages) pour des jobs qui exécutent du code tiers.
permissions:
  contents: read

jobs:
  rego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1  # v2.4.0
        with:
          # Épinglé (revue de sécurité post-#86) : "latest" laissait passer
          # une régression de comportement OPA amont sans qu'aucun contrôle
          # ne la voie — c'est ainsi que le bug de provenance
          # (provenance.bundles.<clé>.revision vs provenance.revision,
          # #86/f649788) est passé inaperçu de la CI, découvert seulement
          # par lecture manuelle contre le vrai binaire. Cette version est
          # celle vérifiée empiriquement dans ce dépôt (deploy/selftest,
          # policies/gen_capabilities.sh) — la faire évoluer est une
          # décision délibérée, jamais un effet de bord de "latest".
          version: 1.20.2
      - name: opa fmt --diff
        run: opa fmt --list --diff policies/rego/
      # Les capabilities se génèrent AVANT le contrôle du bundle (#243) : « opa check » seul
      # accepte time.now_ns, http.send, rand.intn… — seul le validateur statique les attrapait.
      - name: gen_capabilities.sh (fails if a forbidden built-in vanishes from a newer OPA release)
        run: policies/gen_capabilities.sh
      # Le bundle est vérifié CONTRE le fichier restreint : un built-in interdit échoue ici,
      # au chargement, comme il échouera à « opa build --capabilities » (guide de déploiement).
      - name: opa check --capabilities (bundle)
        run: opa check --capabilities policies/capabilities.json policies/rego/
      # Témoin négatif : sans lui, un fichier de capabilities vide ou ignoré ferait passer
      # l'étape précédente sans rien prouver. Ces règles utilisent des built-ins interdits.
      - name: opa check --capabilities (témoin négatif — les built-ins interdits sont refusés)
        run: |
          for f in policies/testdata/rule_http_send.rego policies/testdata/rule_rand_intn.rego; do
            if opa check --capabilities policies/capabilities.json "$f" >/dev/null 2>&1; then
              echo "ERREUR: $f accepté malgré les capabilities restreintes (built-in interdit non refusé)" >&2
              exit 1
            fi
            echo "refusé comme attendu : $f"
          done
      # Tests des paquets de règles (policies/tests/, volontairement hors du
      # bundle et du validateur de déterminisme). Un paquet qui refuse tout
      # passerait sans eux : chaque refus y a son cas voisin autorisé.
      - name: opa test (paquets de règles)
        run: opa test policies/rego/ policies/tests/

  # Le catalogue de conformité (tbp-compliance/) est un actif vivant : ce job
  # échoue s'il dérive (ligne partielle, 🔴 sans issue, ⚪ sans motif, état ou compteurs d'une
  # fiche, dans le README du catalogue ET le README racine, qui ne découlent pas des lignes).
  compliance-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: cohérence du catalogue de conformité
        run: python3 tbp-compliance/check_catalog.py
      # Les liens et images relatifs des documents existent (revue externe : 17 figures des specs cassées).
      - name: liens relatifs des documents
        run: |
          python3 .github/scripts/check_doc_links.py
          python3 .github/scripts/test_check_doc_links.py
      # Issue #193 : toute action doit être épinglée par SHA de commit.
      - name: actions épinglées par SHA (#193)
        run: |
          python3 .github/scripts/check_pinned_actions.py
          python3 .github/scripts/test_check_pinned_actions.py

  nftables-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check nftables syntax (dry parse, no load)
        run: |
          sudo apt-get update && sudo apt-get install -y nftables
          for f in config/nftables/*.nft; do
            echo "Checking $f"
            sudo nft -c -f "$f"
          done

  # Les tests Python du dépôt : ils n'étaient lancés par aucun job (revue externe du 11/10). Bibliothèque standard
  # seulement. `deploy/selftest/test_check_steps.py` est déjà exécuté par selftest.sh ; les tests de l'extension
  # PostgreSQL (src/pep/postgres-extension/tests/) demandent un serveur PostgreSQL et ne sont pas lancés ici.
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: traducteur (mesure, échantillonnage humain)
        run: |
          cd src/translator
          python3 -m unittest -v test_measure test_sample_human
      - name: red team (couverture des feuilles)
        run: |
          cd tests/p2_redteam
          python3 -m unittest -v test_assert_logged
      - name: budget de friction (indicateurs avancés)
        run: |
          cd tests/p1_friction
          python3 -m unittest -v test_leading_indicators

  # Catalogue de conformité #157 (OWASP SCVS), famille « Analyse de
  # composants » : aucun scanner de vulnérabilités des dépendances n'était
  # câblé — govulncheck est l'outil officiel Go, il ne signale que les
  # vulnérabilités RÉELLEMENT atteignables par du code appelé (pas
  # simplement présentes dans go.sum), donc pas de bruit de faux positifs
  # sur une dépendance importée mais jamais invoquée.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.2"
      - name: "install govulncheck (épinglé — même doctrine que OPA ci-dessus : une CVE amont ne doit jamais changer silencieusement de comportement de scan)"
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck ./...
        run: govulncheck ./...

  # Catalogue de conformité #157 (OWASP SCVS), famille « SBOM » : aucune
  # nomenclature logicielle générée. cyclonedx-gomod produit un SBOM
  # CycloneDX du module Go, publié comme artefact du run — pas un gate qui
  # bloque la CI (une nomenclature n'est pas un contrôle pass/fail), juste
  # une preuve de composition publiée à chaque build.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.2"
      - name: install cyclonedx-gomod (épinglé)
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
      - name: générer le SBOM CycloneDX
        run: cyclonedx-gomod mod -json -output sbom.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json

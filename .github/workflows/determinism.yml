name: determinism

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rego-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5  # v2.2.0
        with:
          # Épinglé — même raison et même version que .github/workflows/lint.yml.
          version: 1.20.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.1"
      - name: validate_determinism — bundle policies/rego
        run: go run policies/validate_determinism.go -rego-dir policies/rego -fixtures policies/testdata/stability
      - name: validate_determinism — selftest (fixtures invalides rejetées)
        run: go run policies/validate_determinism.go -selftest

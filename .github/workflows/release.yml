name: release

# Provenance de build SLSA v1.0 (catalogue de conformité #156) pour les
# binaires du dépôt — démons (pepd, brokerd, anod, supervisord, opawatchdog) et outils d'opérateur
# (quorumproof, tbp-audit), plus le SBOM CycloneDX : la liste vit dans scripts/release/build.sh, que la CI
# compile aussi à chaque PR. Vérification par un tiers : SECURITY.md, « Verifying a release ». TBP y est
# évalué comme PRODUCTEUR d'artefacts, jamais comme consommateur de
# skills tiers (angle distinct du trou SkillRegistry, #165).
#
# Niveau 3 SLSA exige que la provenance soit produite PAR LA PLATEFORME
# à propos du build, jamais PAR le script de build lui-même — c'est
# exactement ce que fait le générateur réutilisable officiel
# slsa-framework/slsa-github-generator : il tourne dans un environnement
# GitHub Actions ISOLÉ du job `build` (jobs séparés, `needs:`), signe la
# provenance via OIDC (id-token: write) plutôt qu'avec une clé que ce
# dépôt détiendrait — une provenance non-falsifiable par construction.
#
# Déclenché par un tag de version (vX.Y.Z) OU manuellement
# (workflow_dispatch, pour vérifier le pipeline sans publier de
# release) — le job `release` (téléversement des binaires sur la
# Release GitHub) ne tourne QUE si déclenché par un tag ; le build et la
# provenance tournent dans les deux cas.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Épinglé comme OPA (revue de 30d45af) : « stable » laissait une version de
          # Go différente à chaque exécution, y compris pour la release. La monter est
          # une décision délibérée (govulncheck dit quand), jamais un effet de bord.
          go-version: "1.27.1"
      - name: "build des binaires (scripts/release/build.sh)"
        run: bash scripts/release/build.sh dist
      - name: "SBOM CycloneDX (épinglé, comme le job sbom de lint.yml)"
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          cyclonedx-gomod mod -json -output dist/tbp-network.sbom.cdx.json .
      - name: "sha256 des artefacts (sujets de la provenance SLSA)"
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tbp-binaries
          path: dist/

  # Générateur officiel SLSA — jamais réimplémenté localement : une preuve
  # de provenance vérifiable par un tiers perd sa valeur si l'auditeur
  # doit relire le générateur maison plutôt qu'un outil publiquement audité
  # (même doctrine que le choix de Tessera pour le chaînage Merkle, §6).
  provenance:
    needs: [build]
    permissions:
      actions: read # détecte l'environnement GitHub Actions
      id-token: write # signe la provenance (OIDC), jamais une clé du dépôt
      contents: write # téléverse la provenance sur la release (si tag)
    # EXCEPTION volontaire à l'épinglage par SHA (#193, .github/scripts/
    # check_pinned_actions.py) : slsa-verifier exige que ce générateur soit
    # référencé par un TAG de version — c'est le tag qui prouve l'identité du
    # constructeur de confiance dans la provenance.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    needs: [build, provenance]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tbp-binaries
          path: dist/
      - name: "publier les binaires sur la release"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true

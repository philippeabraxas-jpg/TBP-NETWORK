# EXEMPLE de configuration pgbouncer pour un déploiement devant l'extension
# tbp_pg (les fixtures T17 génèrent la leur, éphémère — ceci documente le
# déploiement de référence, cf. tests/README.md).
#
# D9 : derrière un pooler, le canal d'autorisation légitime est le cache de
# décision partagé (tbp_authorize, D7) — le sceau présenté (tbp_present_seal,
# §4.4(2)) est PAR BACKEND et exige pool_mode = session.

[databases]
tbp = host=127.0.0.1 port=5432 dbname=postgres

[pgbouncer]
; session : requis si le client présente des sceaux (affinité backend).
; transaction : valide UNIQUEMENT pour les sceaux autorisés au cache D7.
pool_mode = session
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = tbp_admin
default_pool_size = 10
max_client_conn = 200
; Les prepared statements nommés sont par session : en mode transaction ils
; ne traversent pas (support pooler > 1.21 seulement, à revoir à l'upgrade).

# Durcissement kernel pour un hôte portant un composant TBP (broker, PEP,
# registre de cellule). À installer dans /etc/sysctl.d/99-tbp-hardening.conf
# puis `sysctl --system`. Ne remplace PAS le durcissement runtime du
# traducteur (spec §4.5 : processus non-root dédié, cap-drop, seccomp) —
# ceci couvre la machine hôte, pas le confinement applicatif.

# --- Réseau : anti-usurpation, anti-redirection malveillante ---
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# --- Isolation mémoire / durcissement générique ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0

# --- Time (spec §6.2 : "le temps est une hypothèse fondatrice explicite") ---
# NTS (RFC 8915) se configure côté client NTP (chrony), pas ici — mais la
# dérive d'horloge dépend aussi de ce paramètre kernel pour les hôtes très
# chargés (submersion, §5.3/§7.6) :
kernel.sched_rt_runtime_us = -1

# --- Rappel volontairement absent d'ici ---
# Le hardening runtime du traducteur (CAP_DROP_ALL, seccomp strict,
# processus non-root dédié — spec §4.5) est spécifique au service vLLM/
# PyTorch et vit dans son unité systemd (voir src/translator/), pas dans ce
# fichier sysctl global.
